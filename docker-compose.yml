version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nfpl_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nfpl_acs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: nfpl_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:password123@db:5432/nfpl_acs
      SECRET_KEY: nfpl-super-secret-jwt-key-2026-production-ready
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
