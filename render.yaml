services:
  - type: web
    name: nfpl-acs-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./dev.db
      - key: POLICY_VERSION
        value: "2026.1"
    healthCheckPath: /api/health
    plan: free
